[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcore"
version = "0.1.0"
description = "Reusable Python library for quantitative finance, portfolio analytics, risk modeling, simulation, and market data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dane Anderson" }
]

dependencies = [
    "numpy",
    "pandas",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["src"]
